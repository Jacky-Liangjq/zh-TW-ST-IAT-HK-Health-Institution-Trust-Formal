<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Formal ST-IAT Desktop Full Browser Test</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #fff; }
    #minno-canvas { width: 100%; height: 88vh; overflow: hidden; }
    #log { height: 12vh; width: 100%; box-sizing: border-box; font: 12px monospace; }
  </style>
</head>
<body>
  <div id="minno-canvas"></div>
  <textarea id="log" aria-label="log"></textarea>
  <script src="https://cdn.jsdelivr.net/gh/minnojs/minno-quest@0.3/dist/pi-minno.js"></script>
  <script>
    window.__testSeed = 20260507;
    function seededRandom(seed) {
      return function () {
        var t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    Math.random = seededRandom(window.__testSeed);

    minnoJS(
      document.getElementById('minno-canvas'),
      'https://cdn.jsdelivr.net/gh/Jacky-Liangjq/zh-TW-ST-IAT-HK-Health-Institution-Trust-Formal@v1.0.8/HKHealthTrustSTIAT.js'
    );
    minnoJS.logger = function (value) {
      document.getElementById('log').value = value;
    };
    minnoJS.onEnd = function () {
      window.__taskEnded = true;
      console.log('task ended');
    };
  </script>
</body>
</html>
